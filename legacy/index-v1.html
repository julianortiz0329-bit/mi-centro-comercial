</head>
<body>
<div class="app">
<header class="topbar">
 <div class="toprow"><div class="topbrand"><div class="logo">◈</div><div><div class="brandname">Mi Centro Comercial</div><div class="brandcaption">Tus negocios, organizados en un solo lugar</div></div></div><div class="local-tag">🔒 Datos en este dispositivo</div></div>
 <nav class="nav" aria-label="Navegación principal">
  <button class="active" data-page="inicio">⌂ Inicio</button><button data-page="clientes">♧ Clientes</button><button data-page="cartera">▤ Cartera y pedidos</button><button data-page="pethome">✦ Alegría Pet Home</button><button data-page="datos">⇅ Datos y copias</button>
 </nav>
</header>
<main class="main" id="main"></main>
<nav class="mobile-bottom" aria-label="Navegación móvil"><button class="active" data-page="inicio"><span>⌂</span>Inicio</button><button data-page="clientes"><span>♧</span>Clientes</button><button data-page="cartera"><span>▤</span>Cartera</button><button data-page="pethome"><span>✦</span>Pet Home</button><button data-page="datos"><span>⇅</span>Datos</button></nav>
</div>
<div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='miCentroComercial_v1';
const BIZ={nogal:{name:'Frutos del Nogal',icon:'🌰',desc:'Frutos secos y fruta deshidratada al por mayor'},puntazo:{name:'El Puntazo',icon:'🎉',desc:'Piñatería y artículos para revendedores'},pethome:{name:'Alegría Pet Home',icon:'🐾',desc:'Productos para mascotas y venta al detal'}};
const money=v=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(v)||0);
const num=v=>{if(typeof v==='number')return v;let s=String(v??'').trim().replace(/\s/g,'').replace(/\$/g,'').replace(/COP/ig,'');if(!s)return 0;if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(s.includes(',')){const parts=s.split(',');s=parts.length===2&&parts[1].length<=2?parts[0].replace(/\./g,'')+'.'+parts[1]:s.replace(/,/g,'')}else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');else if(/\.\d{3}$/.test(s))s=s.replace('.','');return Number(s)||0};
const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let db=loadDB(),page='inicio',clientBiz='nogal',clientSearch='',petTab='productos',productSearch='',activityFilter='';
function loadDB(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return {clients:Array.isArray(d.clients)?d.clients:[],suppliers:Array.isArray(d.suppliers)?d.suppliers:[],products:Array.isArray(d.products)?d.products:[],orders:Array.isArray(d.orders)?d.orders:[],settings:d.settings||{}}}catch(e){return {clients:[],suppliers:[],products:[],orders:[],settings:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){toast('No se pudo guardar. Exporta una copia y libera espacio del navegador.');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){const root=document.getElementById('toast-root');root.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>root.innerHTML='',2700)}
function setPage(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
function head(eyebrow,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subhead">${desc}</p></div>${action}</div>`}
function stat(icon,label,value,note=''){return `<div class="stat"><div class="stat-icon">${icon}</div><div class="stat-label">${label}</div><div class="stat-value">${value}</div><div class="stat-note">${note}</div></div>`}
function render(){const main=document.getElementById('main');if(page==='inicio')main.innerHTML=renderHome();else if(page==='clientes')main.innerHTML=renderClients();else if(page==='cartera')main.innerHTML=renderOrders();else if(page==='pethome')main.innerHTML=renderPetHome();else main.innerHTML=renderData();bindDynamic()}
function localDate(d=new Date()){const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function dayDiff(date){if(!date)return 999;const a=new Date(date+'T12:00:00'),b=new Date(localDate()+'T12:00:00');return Math.round((a-b)/86400000)}
function agendaDone(){db.settings=db.settings||{};db.settings.agendaDone=db.settings.agendaDone||{};return db.settings.agendaDone}
function buildAgenda(){const today=localDate(),done=agendaDone(),tasks=[];const push=t=>{if(!done[t.key])tasks.push(t)};
 (db.orders||[]).forEach(o=>{const bal=orderBalance(o),biz=BIZ[o.business]?.name||o.business||'Negocio';if(bal>0&&o.dueDate){const d=dayDiff(o.dueDate);if(d<=7)push({key:`cobro:${o.id}:${o.dueDate}`,type:'cobro',icon:'💳',title:`Cobrar a ${o.customer||'cliente sin nombre'}`,business:biz,date:o.dueDate,amount:bal,days:d,priority:d<0?0:d===0?1:2,detail:`Saldo pendiente: ${money(bal)}`,action:'payment-order',id:o.id,cta:'Registrar cobro'})}
 if(!o.dispatchDate)push({key:`despacho:${o.id}`,type:'despacho',icon:'📦',title:`Preparar / despachar ${o.orderNo?'pedido '+o.orderNo:'pedido de '+(o.customer||'cliente')}`,business:biz,date:o.orderDate||o.createdAt?.slice(0,10)||today,amount:bal,days:dayDiff(o.orderDate||o.createdAt?.slice(0,10)||today),priority:3,detail:`Valor del pedido: ${money(o.amount)}${o.dispatchRef?' · '+o.dispatchRef:''}`,action:'dispatch-order',id:o.id,cta:'Registrar despacho'})});
 (db.clients||[]).forEach(c=>{if(c.followUp){const d=dayDiff(c.followUp);if(d<=7)push({key:`contacto:${c.id}:${c.followUp}`,type:'contacto',icon:'📞',title:`Contactar a ${c.name||'cliente'}`,business:BIZ[c.business]?.name||c.business||'Negocio',date:c.followUp,days:d,priority:d<0?0:d===0?1:4,detail:[c.city,c.activity].filter(Boolean).join(' · ')||'Seguimiento comercial pendiente',action:'edit-client',id:c.id,cta:'Abrir cliente'})}});
 (db.settings.agendaTasks||[]).forEach(t=>{const d=dayDiff(t.date);if(!t.done)push({key:`manual:${t.id}`,type:t.type||'otro',icon:t.type==='visita'?'🚗':t.type==='llamada'?'📞':t.type==='despacho'?'📦':t.type==='cobro'?'💵':'📌',title:t.title,business:t.business||'Personal / general',date:t.date,days:d,priority:d<0?0:d===0?1:d<=2?2:5,detail:t.notes||'Tarea programada',action:'complete-agenda',id:t.id,cta:'Marcar hecha',manual:true})});
 return tasks.sort((a,b)=>a.priority-b.priority||(a.date||'').localeCompare(b.date||'')).slice(0,100)}
function taskDateLabel(t){if(t.days<0)return `Vencida hace ${Math.abs(t.days)} día(s) · ${t.date}`;if(t.days===0)return `PARA HOY · ${t.date}`;if(t.days===1)return `Mañana · ${t.date}`;return `${t.date} · en ${t.days} día(s)`}
function renderAgendaTasks(filter='todos'){const all=buildAgenda(),shown=all.filter(t=>filter==='todos'||(filter==='vencidos'&&t.days<0)||(filter==='hoy'&&t.days===0)||(filter==='proximos'&&t.days>0)||(filter==='cobros'&&t.type==='cobro')||(filter==='clientes'&&t.type==='contacto')||(filter==='despachos'&&t.type==='despacho'));if(!shown.length)return `<div class="empty compact-empty"><div class="empty-icon">🌿</div><strong>${filter==='vencidos'?'No tienes tareas vencidas':'No hay tareas en esta vista'}</strong><p>Agrega tareas o programa fechas en tus clientes y pedidos. La agenda reunirá aquí los cobros, seguimientos y despachos.</p><button class="btn btn-primary" data-action="new-agenda-task">＋ Programar tarea</button></div>`;return `<div class="agenda-list">${shown.slice(0,30).map(t=>`<article class="agenda-task ${t.days<0?'overdue':t.days===0?'today':''}"><div class="agenda-task-icon">${t.icon}</div><div class="agenda-task-main"><div class="agenda-task-title">${esc(t.title)}</div><div class="agenda-task-meta">${esc(t.business)} · ${esc(taskDateLabel(t))}</div><div class="agenda-task-note">${esc(t.detail||'')}${t.amount!==undefined&&t.type!=='cobro'?` · Saldo ${money(t.amount)}`:''}</div><div class="agenda-task-actions">${t.action==='payment-order'?`<button class="btn btn-primary btn-small" data-action="payment-order" data-id="${t.id}">${t.cta}</button>`:t.action==='dispatch-order'?`<button class="btn btn-primary btn-small" data-action="dispatch-order" data-id="${t.id}">${t.cta}</button>`:t.action==='edit-client'?`<button class="btn btn-secondary btn-small" data-action="edit-client" data-id="${t.id}">${t.cta}</button><button class="btn btn-plain btn-small" data-action="complete-agenda" data-key="${esc(t.key)}">Marcar contacto hecho</button>`:`<button class="btn btn-primary btn-small" data-action="complete-agenda" data-key="${esc(t.key)}">${t.cta}</button>`}${t.manual?`<button class="btn btn-plain btn-small" data-action="delete-agenda-task" data-id="${t.id}">Eliminar</button>`:''}</div></div></article>`).join('')}</div>${shown.length>30?`<p class="agenda-count">Mostrando 30 de ${shown.length} tareas. Usa los filtros para acotar.</p>`:''}`}
function salesForBusiness(business,period='month'){
 const now=localDate(),month=now.slice(0,7);let orders=(db.orders||[]).filter(o=>o.business===business);
 const dated=orders.filter(o=>{const d=String(o.orderDate||o.createdAt||'').slice(0,10);return d.length>=10&&(period==='all'||(period==='month'&&d.slice(0,7)===month))});
 return {total:dated.reduce((sum,o)=>sum+Math.max(0,num(o.amount)),0),count:dated.length,all:orders.reduce((sum,o)=>sum+Math.max(0,num(o.amount)),0),allCount:orders.length};
}
function renderSalesGoals(){db.settings=db.settings||{};const goals=db.settings.salesGoals||{};const monthLabel=new Date().toLocaleDateString('es-CO',{month:'long',year:'numeric'});return `<section class="panel sales-panel"><div class="sales-toolbar"><div><h2>🎯 Mis metas de ventas</h2><p style="margin:4px 0 0">Ventas registradas en ${esc(monthLabel)} y avance de cada negocio.</p></div><button class="btn btn-secondary btn-small" data-action="sales-goals">⚙️ Configurar metas</button></div><div class="sales-grid">${Object.entries(BIZ).map(([key,b])=>{const m=salesForBusiness(key,'month'),goal=Math.max(0,num(goals[key])),pct=goal>0?Math.min(100,m.total/goal*100):0,over=goal>0&&m.total>=goal;return `<article class="sales-card ${over?'reached':''}"><div class="sales-card-top"><div class="sales-business-icon">${b.icon}</div><div><div class="sales-business-name">${b.name}</div><div class="sales-business-caption">${m.count} venta(s) este mes</div></div></div><div class="sales-value-label">Vendido este mes</div><div class="sales-value">${money(m.total)}</div><div class="sales-subrow"><span>${goal>0?'Meta: '+money(goal):'Meta mensual sin configurar'}</span><strong>${goal>0?Math.round(m.total/goal*100)+'%':'—'}</strong></div><div class="sales-track"><div class="sales-progress ${over?'over':''}" style="--progress:${pct}%"></div></div><div class="sales-foot"><span class="sales-total">Histórico: ${money(m.all)}</span><span class="sales-goal-note ${goal?'':'missing'}">${over?'🏆 ¡Meta alcanzada!':goal?money(Math.max(0,goal-m.total))+' para la meta':'Define una meta'}</span></div></article>`}).join('')}</div><div class="sales-period">Se cuenta el valor total de los pedidos registrados por fecha de pedido; no el dinero cobrado. Para Alegría Pet Home, registra las ventas como pedidos para que aparezcan en la métrica.</div></section>`}
function openSalesGoalsForm(){db.settings=db.settings||{};const g=db.settings.salesGoals||{};const body=`<div class="notice">Define cuánto quieres vender durante el mes en cada negocio. Las metas no alteran tus ventas ni comisiones; solo calculan el avance.</div><div class="form-grid">${field('nogal','Meta mensual · Frutos del Nogal (COP)',g.nogal||'','number',{min:0,step:'1000',placeholder:'Ej. 15000000'})}${field('puntazo','Meta mensual · El Puntazo (COP)',g.puntazo||'','number',{min:0,step:'1000',placeholder:'Ej. 10000000'})}${field('pethome','Meta mensual · Alegría Pet Home (COP)',g.pethome||'','number',{min:0,step:'1000',placeholder:'Ej. 3000000'})}</div>`;openModal('Configurar metas de ventas','Puedes dejar una meta en cero o vacía si todavía no deseas configurarla.',body,fd=>{const v=Object.fromEntries(fd.entries());db.settings.salesGoals={nogal:Math.max(0,num(v.nogal)),puntazo:Math.max(0,num(v.puntazo)),pethome:Math.max(0,num(v.pethome))};save();closeModal();render();toast('Metas de ventas actualizadas')})}

function renderHome(){const today=localDate(),clients=db.clients||[],orders=db.orders||[],agenda=buildAgenda();const overdue=orders.filter(o=>orderBalance(o)>0&&o.dueDate&&o.dueDate<today),noDispatch=orders.filter(o=>!o.dispatchDate),balance=orders.reduce((a,o)=>a+orderBalance(o),0);const nog=clients.filter(c=>c.business==='nogal').length,punt=clients.filter(c=>c.business==='puntazo').length,urgent=agenda.filter(t=>t.days<=0).length;
 return `${head('TU RESUMEN DE HOY','¡Hola! ¿Qué vamos a organizar?','Una agenda integral para combinar visitas, llamadas, pedidos y cobros.','<button class="btn btn-primary" data-action="new-agenda-task">＋ Programar tarea</button>')}<div class="welcome-strip"><div><span class="welcome-kicker">TU DÍA, MÁS ORGANIZADO</span><h2>Primero lo urgente.<br>Después, haz crecer tus negocios.</h2><p>La agenda reúne cobros, seguimientos, despachos y tareas que tú programes.</p></div><div class="welcome-emoji">🗓️</div></div>
 <div class="section-title"><div><h2>Tu día en números</h2><p>Una vista rápida para decidir por dónde empezar.</p></div><button class="text-action" data-page="cartera">Ver cartera →</button></div><div class="stats home-stats">${stat('💳','Por cobrar',money(balance),`${orders.filter(o=>orderBalance(o)>0).length} pedidos con saldo`)}${stat('⚠️','Cobros vencidos',String(overdue.length),overdue.length?'Prioriza la recuperación':'No hay cobros vencidos')}${stat('📦','Pedidos sin despacho',String(noDispatch.length),'Revisa qué falta por preparar o enviar')}${stat('🎯','Tareas para hoy o vencidas',String(urgent),'Ordenadas por urgencia')}</div>
 ${renderSalesGoals()}
 <div class="panel"><div class="panel-header"><div><h2>Agenda de trabajo</h2><p style="margin:4px 0 0">Primero vencimientos; después, tareas de hoy y próximas.</p></div><span class="tag ${urgent?'gold':''}">${urgent} urgentes</span></div><div class="agenda-toolbar"><button class="btn btn-primary btn-small" data-action="new-agenda-task">＋ Nueva tarea</button><button class="btn btn-plain btn-small" data-action="agenda-notifications">🔔 Activar avisos</button><button class="btn btn-plain btn-small" data-action="go-orders">Cartera y pedidos</button></div><div class="agenda-filters"><button class="active" data-agenda-filter="todos">Todo</button><button data-agenda-filter="vencidos">Vencidos</button><button data-agenda-filter="hoy">Hoy</button><button data-agenda-filter="proximos">Próximos</button><button data-agenda-filter="cobros">Cobros</button><button data-agenda-filter="clientes">Clientes</button><button data-agenda-filter="despachos">Despachos</button></div><div id="agenda-task-list">${renderAgendaTasks()}</div><div class="agenda-count" style="margin-top:10px">Los avisos del navegador funcionan cuando la app está abierta o activa; no se garantizan notificaciones en segundo plano.</div></div>
 <div class="section-title"><div><h2>Accesos rápidos</h2><p>Registra lo más habitual sin recorrer varios menús.</p></div></div><div class="action-grid"><button class="action-tile tile-green" data-action="new-order"><span class="action-symbol">＋</span><span><b>Nuevo pedido</b><small>Registrar venta y fecha de cobro</small></span><span class="tile-arrow">›</span></button><button class="action-tile tile-blue" data-action="go-orders"><span class="action-symbol">💵</span><span><b>Registrar un cobro</b><small>Abrir cartera y añadir abono</small></span><span class="tile-arrow">›</span></button><button class="action-tile tile-gold" data-action="go-clients" data-biz="nogal"><span class="action-symbol">🌰</span><span><b>Cliente de Nogal</b><small>Guardar contacto o seguimiento</small></span><span class="tile-arrow">›</span></button><button class="action-tile tile-purple" data-action="go-clients" data-biz="puntazo"><span class="action-symbol">🎉</span><span><b>Cliente de El Puntazo</b><small>Guardar mayorista o revendedor</small></span><span class="tile-arrow">›</span></button></div>
 <div class="section-title"><div><h2>Tus tres negocios</h2><p>Entra directamente a cada área.</p></div></div><div class="business-strip">${Object.entries(BIZ).map(([k,b])=>`<div class="business-card"><div class="biz-icon">${b.icon}</div><div class="biz-content"><strong>${b.name}</strong><p>${b.desc}</p><div class="biz-foot"><span>${k==='pethome'?db.products.length+' productos':(k==='nogal'?nog:punt)+' clientes'}</span><button class="btn btn-secondary btn-small" data-action="${k==='pethome'?'go-pet':'go-clients'}" ${k==='pethome'?'data-tab="productos"':`data-biz="${k}"`}>Abrir sección ↗</button></div></div></div>`).join('')}</div><div class="notice home-notice">🔐 <b>Tus datos son locales.</b> Haz una copia de seguridad en “Datos y copias”. Las tareas nuevas se guardan en la configuración existente sin borrar clientes, pedidos ni productos.</div>`}

function openAgendaTaskForm(){const body=`<div class="form-grid">${field('title','¿Qué tienes que hacer?','','text',{required:true,placeholder:'Ej. Visitar cliente en Itagüí'})}${field('type','Tipo de tarea','visita','select',{required:true,options:[{value:'visita',label:'Visita comercial'},{value:'llamada',label:'Llamada / seguimiento'},{value:'cobro',label:'Cobro'},{value:'despacho',label:'Pedido / despacho'},{value:'otro',label:'Otra tarea'}]})}${field('date','Fecha programada',localDate(),'date',{required:true})}${field('business','Negocio','nogal','select',{options:[{value:'nogal',label:'Frutos del Nogal'},{value:'puntazo',label:'El Puntazo'},{value:'pethome',label:'Alegría Pet Home'},{value:'general',label:'General / personal'}]})}${field('notes','Notas / dirección / contexto','','textarea',{full:true,placeholder:'Dirección, persona de contacto, qué debes llevar o preguntar…'})}</div>`;openModal('Programar tarea','La tarea aparecerá en tu agenda y se ordenará según la fecha.',body,fd=>{const v=Object.fromEntries(fd.entries());db.settings=db.settings||{};db.settings.agendaTasks=Array.isArray(db.settings.agendaTasks)?db.settings.agendaTasks:[];db.settings.agendaTasks.push({id:id(),title:v.title.trim(),type:v.type,date:v.date,business:v.business,notes:v.notes||'',done:false,createdAt:new Date().toISOString()});save();closeModal();setPage('inicio');toast('Tarea agregada a tu agenda')})}
async function enableAgendaNotifications(){if(!('Notification' in window)){toast('Este navegador no admite notificaciones. Puedes seguir usando la agenda interna.');return}try{const permission=await Notification.requestPermission();if(permission==='granted'){db.settings=db.settings||{};db.settings.agendaNotifications=true;save();toast('Avisos permitidos. Se mostrarán cuando la app esté abierta y detecte pendientes.');notifyAgendaIfNeeded()}else toast('No se activaron los avisos. Puedes permitirlos desde la configuración del navegador.')}catch(e){toast('No se pudo activar el permiso de notificaciones.')}}
function notifyAgendaIfNeeded(){try{if(!('Notification' in window)||Notification.permission!=='granted')return;const today=localDate();db.settings=db.settings||{};if(db.settings.lastAgendaNotice===today)return;const urgent=buildAgenda().filter(t=>t.days<=0);if(!urgent.length)return;new Notification('Mi Centro Comercial',{body:`Tienes ${urgent.length} tarea(s) vencida(s) o para hoy. Abre la agenda para verlas.`});db.settings.lastAgendaNotice=today;save()}catch(e){}}

function renderClientResults(filtered){return filtered.length?`<div class="client-list">${filtered.map(c=>clientCard(c)).join('')}</div>`:`<div class="empty"><div class="empty-icon">${BIZ[clientBiz].icon}</div><strong>${clientSearch?'No encontramos coincidencias':'Tu lista de clientes está lista para empezar'}</strong><p>${clientSearch?'Prueba con otro nombre, ciudad o teléfono.':'Agrega un cliente o importa un archivo CSV. Podrás abrir WhatsApp desde cada ficha.'}</p><button class="btn btn-primary" data-action="new-client">＋ Agregar cliente</button></div>`}
function renderDue(){const today=localDate();const list=db.clients.filter(c=>c.followUp&&c.followUp<=today).sort((a,b)=>a.followUp.localeCompare(b.followUp)).slice(0,5);if(!list.length)return `<div class="empty"><div class="empty-icon">☀️</div><strong>No tienes seguimientos vencidos</strong><p>Agrega una fecha de seguimiento a tus clientes para no dejar oportunidades pendientes.</p></div>`;return `<div class="client-list">${list.map(c=>`<div class="item-card"><div class="item-top"><div><div class="item-title">${esc(c.name)}</div><div class="item-sub">${esc(BIZ[c.business]?.name||c.business)} · ${esc(c.city||'Ciudad sin registrar')}</div></div><span class="tag gold">${esc(c.followUp)}</span></div><div class="item-actions"><button class="btn btn-secondary btn-small" data-action="edit-client" data-id="${c.id}">Editar</button>${waButton(c.phone)}</div></div>`).join('')}</div>`}
function renderClients(){const filtered=db.clients.filter(c=>c.business===clientBiz&&(`${c.name} ${c.city} ${c.phone} ${c.activity} ${c.notes}`.toLowerCase().includes(clientSearch.toLowerCase()))&&(activityFilter===''||c.activity===activityFilter));const activities=[...new Set(db.clients.filter(c=>c.business===clientBiz&&c.activity).map(c=>c.activity))].sort();return `${head('GESTIÓN COMERCIAL','Clientes','Mantén tus contactos, últimas compras y seguimientos en orden.','<button class="btn btn-primary" data-action="new-client">＋ Cliente</button>')}
<div class="tabs">${Object.entries(BIZ).map(([k,b])=>`<button class="${clientBiz===k?'active':''}" data-action="client-biz" data-biz="${k}">${b.icon} ${b.name}</button>`).join('')}</div>
<div class="toolbar"><div class="search"><span class="magnify">⌕</span><input id="client-search" placeholder="Buscar nombre, ciudad, teléfono…" value="${esc(clientSearch)}"></div><button class="btn btn-plain file-action">⇧ Importar CSV<input type="file" accept=".csv,text/csv" data-import="clients"></button><button class="btn btn-plain" data-action="export-clients">⇩ Exportar CSV</button></div>

function calc(p){const gross=num(p.cost), supplierRate=num(p.supplierIvaRate);const cost=(p.costIncludesIVA&&supplierRate>0)?gross/(1+supplierRate/100):gross;const margin=Math.min(95,Math.max(0,num(p.margin)));const sale=margin<100?cost/(1-margin/100):cost;const vRate=Number(p.saleIvaRate)||0;const iva=sale*vRate/100;return {gross,cost,margin,sale,iva,total:sale+iva,profit:sale-cost,rate:vRate}}

function renderProducts(){const list=db.products.filter(p=>`${p.name} ${p.category} ${p.presentation} ${p.supplierName} ${p.sku}`.toLowerCase().includes(productSearch.toLowerCase()));return `<div class="notice">💡 El precio sugerido usa el margen sobre el precio de venta antes de IVA: <b>precio = costo neto ÷ (1 − margen)</b>. Es una ayuda comercial, no una clasificación tributaria automática.</div><div class="toolbar"><div class="search"><span class="magnify">⌕</span><input id="product-search" placeholder="Buscar producto, categoría, proveedor…" value="${esc(productSearch)}"></div><button class="btn btn-plain file-action">⇧ Importar lista CSV<input type="file" accept=".csv,text/csv" data-import="products"></button><button class="btn btn-plain" data-action="export-products">⇩ Exportar CSV</button></div><div id="product-results">${renderProductResults(list)}</div>`}

function openModal(title,subtitle,body,onSave,saveText='Guardar'){const root=document.getElementById('modal-root');root.innerHTML=`<div class="modal-backdrop" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><div><h2 id="modal-title">${title}</h2><p>${subtitle}</p></div><button class="close-btn" type="button" data-modal-close aria-label="Cerrar">×</button></div><form id="modal-form">${body}<div class="modal-footer"><button class="btn btn-plain" type="button" data-modal-close>Cancelar</button><button class="btn btn-primary" type="submit">${saveText}</button></div></form></section></div>`;root.querySelectorAll('[data-modal-close]').forEach(b=>b.addEventListener('click',closeModal));root.querySelector('#modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()});root.querySelector('#modal-form').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget);onSave(fd,e.currentTarget)});setTimeout(()=>root.querySelector('input:not([type=hidden])')?.focus(),80)}
function closeModal(){document.getElementById('modal-root').innerHTML=''}
function field(name,label,value='',type='text',opts={}){let val=esc(value);let attrs=opts.required?'required':'';if(type==='select'){return `<div class="field ${opts.full?'full':''}"><label>${label}</label><select name="${name}" ${attrs}>${opts.options.map(o=>`<option value="${esc(o.value)}" ${String(o.value)===String(value)?'selected':''}>${esc(o.label)}</option>`).join('')}</select>${opts.help?`<small>${opts.help}</small>`:''}</div>`}if(type==='textarea')return `<div class="field ${opts.full?'full':''}"><label>${label}</label><textarea name="${name}" ${attrs} placeholder="${esc(opts.placeholder||'')}">${val}</textarea></div>`;if(type==='checkbox')return `<div class="field ${opts.full?'full':''}"><label class="checkline"><input type="checkbox" name="${name}" ${value?'checked':''}> <span>${label}${opts.help?`<small>${opts.help}</small>`:''}</span></label></div>`;return `<div class="field ${opts.full?'full':''}"><label>${label}</label><input name="${name}" type="${type}" value="${val}" ${attrs} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.max!==undefined?`max="${opts.max}"`:''} ${opts.step?`step="${opts.step}"`:''} placeholder="${esc(opts.placeholder||'')}">${opts.help?`<small>${opts.help}</small>`:''}</div>`}
function openClientForm(c){const editing=!!c;const data=c||{business:clientBiz,city:'',name:'',activity:'',phone:'',lastOrder:'',orderValue:'',followUp:'',notes:''};const activitySuggestions=[...new Set(db.clients.filter(x=>x.business===data.business&&x.activity).map(x=>x.activity))];const body=`<div class="form-grid">${field('business','Negocio',data.business,'select',{required:true,options:Object.entries(BIZ).map(([value,b])=>({value,label:b.name}))})}${field('name','Nombre del cliente o negocio',data.name,'text',{required:true,placeholder:'Ej. Distribuciones La 80'})}${field('city','Ciudad',data.city,'text',{placeholder:'Ej. Medellín'})}<div class="field"><label>Actividad comercial</label><input name="activity" list="activity-options" value="${esc(data.activity)}" placeholder="Ej. piñatería, remate, tienda…"><datalist id="activity-options">${activitySuggestions.map(a=>`<option value="${esc(a)}">`).join('')}${['Piñatería','Juguetería','Remate','Revendedor','Mayorista','Tienda de mascotas','Cliente final','Distribuidor'].map(a=>`<option value="${a}">`).join('')}</datalist><small>Puedes escribir una actividad nueva.</small></div>${field('phone','Teléfono / WhatsApp',data.phone,'tel',{placeholder:'Ej. 3001234567'})}${field('lastOrder','Fecha del último pedido',data.lastOrder,'date')}${field('orderValue','Valor del último pedido (COP)',data.orderValue,'number',{min:0,step:'any'})}${field('followUp','Próximo seguimiento',data.followUp,'date')}${field('notes','Notas comerciales',data.notes,'textarea',{full:true,placeholder:'Intereses, productos que compra, condiciones…'})}</div>`;openModal(editing?'Editar cliente':'Nuevo cliente','Información comercial y seguimiento',body,(fd)=>{const obj=Object.fromEntries(fd.entries());obj.orderValue=num(obj.orderValue);if(editing)Object.assign(c,obj);else db.clients.unshift({id:id(),createdAt:new Date().toISOString(),...obj});save();closeModal();clientBiz=obj.business;clientSearch='';activityFilter='';setPage('clientes');toast(editing?'Cliente actualizado':'Cliente guardado')})}
function openSupplierForm(s){const editing=!!s,data=s||{name:'',contact:'',phone:'',email:'',notes:''};const body=`<div class="form-grid">${field('name','Nombre del proveedor',data.name,'text',{required:true})}${field('contact','Persona de contacto',data.contact)}${field('phone','Teléfono / WhatsApp',data.phone,'tel')}${field('email','Correo electrónico',data.email,'email')}${field('notes','Notas',data.notes,'textarea',{full:true})}</div>`;openModal(editing?'Editar proveedor':'Nuevo proveedor','Directorio de proveedores de Pet Home',body,fd=>{const o=Object.fromEntries(fd.entries());if(editing)Object.assign(s,o);else db.suppliers.unshift({id:id(),...o});save();closeModal();render();toast(editing?'Proveedor actualizado':'Proveedor guardado')})}
function openProductForm(p,duplicate=false){const editing=!!p&&!duplicate;const data=p?{...p}: {name:'',category:'',presentation:'',supplierId:'',supplierName:'',sku:'',cost:'',costIncludesIVA:false,supplierIvaRate:0,saleIvaType:'19',saleIvaRate:19,margin:35};const supplierOpts=[{value:'',label:'Sin asignar'},...db.suppliers.map(s=>({value:s.id,label:s.name}))];const typeOpts=[{value:'19',label:'Tarifa 19%'},{value:'5',label:'Tarifa 5%'},{value:'0',label:'Tarifa 0%'},{value:'exento',label:'Exento (0%)'},{value:'excluido',label:'Excluido (0%)'}];const body=`<div class="form-grid">${field('name','Nombre del producto',data.name,'text',{required:true,placeholder:'Ej. Pelota para perro'})}${field('category','Categoría',data.category,'text',{placeholder:'Ej. juguetes, higiene, paseo'})}${field('presentation','Presentación',data.presentation,'text',{placeholder:'Ej. unidad, paquete x 3, 250 g'})}${field('sku','Referencia / SKU',data.sku)}${field('supplierId','Proveedor',data.supplierId,'select',{options:supplierOpts})}${field('cost','Precio cotizado / costo de compra (COP)',data.cost,'number',{required:true,min:0,step:'any'})}${field('costIncludesIVA','El precio de compra indicado ya incluye IVA',data.costIncludesIVA,'checkbox',{help:'Márcalo solo si el valor del proveedor incluye IVA.'})}${field('supplierIvaRate','Tarifa de IVA incluida en el costo',String(data.supplierIvaRate??0),'select',{options:[{value:'0',label:'0% / no cobra IVA'},{value:'5',label:'5%'},{value:'19',label:'19%'}],help:'Solo se usa para estimar el costo sin IVA si lo incluiste en el valor.'})}${field('saleIvaType','Clasificación de IVA para tu venta',data.saleIvaType||String(data.saleIvaRate??19),'select',{required:true,options:typeOpts})}${field('margin','Margen deseado sobre la venta (%)',data.margin,'number',{required:true,min:0,max:90,step:'0.5',help:'Ej. 35% de margen bruto antes del IVA de venta.'})}<div class="field full"><div id="product-preview" class="notice">Completa costo y margen para revisar el precio sugerido.</div></div></div><div class="notice warn">Confirma con tu contador la tarifa y el tratamiento tributario reales del producto. El cálculo de IVA de compra es orientativo: no determina si ese IVA es descontable fiscalmente.</div>`;openModal(editing?'Editar producto':duplicate?'Duplicar producto':'Nuevo producto','Costo, proveedor, margen y clasificación tributaria',body,(fd,form)=>{const o=Object.fromEntries(fd.entries());o.cost=num(o.cost);o.costIncludesIVA=form.querySelector('[name=costIncludesIVA]').checked;o.supplierIvaRate=num(o.supplierIvaRate);o.saleIvaType=o.saleIvaType||'19';o.saleIvaRate=['exento','excluido'].includes(o.saleIvaType)?0:num(o.saleIvaType);o.margin=Math.min(90,Math.max(0,num(o.margin)));const su=db.suppliers.find(s=>s.id===o.supplierId);o.supplierName=su?.name||'';o.updatedAt=localDate();if(editing)Object.assign(p,o);else db.products.unshift({id:id(),...o});save();closeModal();render();toast(editing?'Producto actualizado':'Producto guardado')});const form=document.querySelector('#modal-form');const preview=()=>{const fd=new FormData(form),o=Object.fromEntries(fd.entries());o.cost=num(o.cost);o.supplierIvaRate=num(o.supplierIvaRate);o.margin=num(o.margin);o.costIncludesIVA=form.querySelector('[name=costIncludesIVA]').checked;o.saleIvaRate=['exento','excluido'].includes(o.saleIvaType)?0:num(o.saleIvaType);const c=calc(o);const el=form.querySelector('#product-preview');el.innerHTML=`<b>Vista previa estimada</b><div class="price-grid"><div class="price-cell"><span>Costo neto</span><strong>${money(c.cost)}</strong></div><div class="price-cell"><span>Ganancia bruta</span><strong>${money(c.profit)}</strong></div><div class="price-cell highlight"><span>Venta antes de IVA</span><strong>${money(c.sale)}</strong></div><div class="price-cell"><span>IVA / Total</span><strong>${money(c.iva)} / ${money(c.total)}</strong></div></div>`};form.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',preview));preview()}
function orderCommission(o){const amount=Math.max(0,num(o.amount)),paid=Math.min(amount,Math.max(0,num(o.paid)));if(o.business==='nogal'){const rate=o.saleType==='mayorista'?0.4:0.75;return {sale:amount*rate/100,collection:paid*rate/100,total:amount*rate/100+paid*rate/100,rateLabel:`${rate}% venta + ${rate}% cobro`}}if(o.business==='puntazo'){return {sale:0,collection:paid*0.06,total:paid*0.06,rateLabel:'6% por cobro'}}return {sale:0,collection:0,total:0,rateLabel:'Sin comisión configurada'}}
function orderBalance(o){return Math.max(0,num(o.amount)-num(o.paid))}
function renderOrders(){const orders=(db.orders||[]).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));const totalDue=orders.reduce((a,o)=>a+orderBalance(o),0),paidTotal=orders.reduce((a,o)=>a+Math.min(num(o.amount),num(o.paid)),0),comm=orders.reduce((a,o)=>a+orderCommission(o).total,0);return `${head('PEDIDOS · DESPACHOS · CARTERA','Seguimiento de cartera','Registra qué pedido salió, cuándo debe cobrarse, abonos recibidos y la comisión que te corresponde.','<button class="btn btn-primary" data-action="new-order">＋ Nuevo pedido</button>')}

function csvEscape(v){const s=String(v??'');return /[",;\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(filename,headers,rows){download(filename,[headers.map(csvEscape).join(','),...rows.map(row=>row.map(csvEscape).join(','))].join('\r\n'),'text/csv;charset=utf-8')}

function splitCSV(text){text=text.replace(/^\ufeff/,'');const first=text.split(/\r?\n/).find(x=>x.trim())||'';const delimiter=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',';let rows=[],row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++}else quote=!quote}else if(ch===delimiter&&!quote){row.push(cell.trim());cell=''}else if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=ch}if(cell!==''||row.length){row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row)}return rows}
function keyify(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function mapHeader(headers,aliases){for(let i=0;i<headers.length;i++)if(aliases.includes(keyify(headers[i])))return i;return -1}
function val(row,idx,def=''){return idx<0?'':(row[idx]??def).trim()}
async function importCsv(file,type){try{const text=await file.text(),rows=splitCSV(text);if(rows.length<2){toast('El CSV no tiene filas de datos.');return}const headers=rows[0],data=rows.slice(1);let added=0,skipped=0;if(type==='clients'){const ix={business:mapHeader(headers,['negocio','business','empresa']),name:mapHeader(headers,['nombre','cliente','nombrecliente','razonsocial']),city:mapHeader(headers,['ciudad','city']),activity:mapHeader(headers,['actividad','actividadcomercial','tipo','categoria']),phone:mapHeader(headers,['telefono','celular','whatsapp','phone']),lastOrder:mapHeader(headers,['ultimopedido','fechaultimopedido','ultimacompra']),orderValue:mapHeader(headers,['valorultimopedido','valorpedido','montopedido']),followUp:mapHeader(headers,['seguimiento','proximoseguimiento','fechaseguimiento']),notes:mapHeader(headers,['notas','observaciones','notes'])};if(ix.name<0){toast('No veo una columna “nombre” o “cliente”. Revisa la plantilla.');return}for(const r of data){const name=val(r,ix.name);if(!name){skipped++;continue}let bx=val(r,ix.business).toLowerCase();let business=bx.includes('nogal')?'nogal':bx.includes('puntazo')?'puntazo':bx.includes('pet')?'pethome':clientBiz;const rawDate=val(r,ix.lastOrder),rawFollow=val(r,ix.followUp);db.clients.push({id:id(),business,name,city:val(r,ix.city),activity:val(r,ix.activity),phone:val(r,ix.phone),lastOrder:rawDate,orderValue:num(val(r,ix.orderValue)),followUp:rawFollow,notes:val(r,ix.notes),createdAt:new Date().toISOString()});added++}}else if(type==='products'){const ix={name:mapHeader(headers,['nombre','producto','name','product']),category:mapHeader(headers,['categoria','category','tipo']),presentation:mapHeader(headers,['presentacion','empaque','unidad','formato']),supplier:mapHeader(headers,['proveedor','supplier','marca']),cost:mapHeader(headers,['costo','precio','preciocompra','cost','valorunitario']),includes:mapHeader(headers,['costoincluyeiva','ivaincluido','precioincluyeiva']),supplierVAT:mapHeader(headers,['ivaproveedor','ivacompra','tarifaproveedor']),saleVAT:mapHeader(headers,['ivaventa','iva','tarifaiva']),margin:mapHeader(headers,['margen','margendeseado','margenobjetivo']),sku:mapHeader(headers,['sku','referencia','codigo','ref'])};if(ix.name<0||ix.cost<0){toast('La lista debe tener al menos columnas de nombre/producto y costo/precio.');return}for(const r of data){const name=val(r,ix.name),cost=num(val(r,ix.cost));if(!name){skipped++;continue}const supplierName=val(r,ix.supplier);let supplier=db.suppliers.find(s=>keyify(s.name)===keyify(supplierName));if(supplierName&&!supplier){supplier={id:id(),name:supplierName,contact:'',phone:'',email:'',notes:'Importado desde lista de precios'};db.suppliers.push(supplier)}let sv=num(val(r,ix.supplierVAT,'0'));if(![0,5,19].includes(sv))sv=0;const includesRaw=keyify(val(r,ix.includes));const includes=['si','sí','yes','true','1','incluido'].includes(includesRaw);let saleRaw=val(r,ix.saleVAT,'19').toLowerCase();let saleType=keyify(saleRaw).includes('excluido')?'excluido':keyify(saleRaw).includes('exento')?'exento':String(num(saleRaw)===5?5:num(saleRaw)===0?0:19);db.products.push({id:id(),name,category:val(r,ix.category),presentation:val(r,ix.presentation),supplierId:supplier?.id||'',supplierName,cost,costIncludesIVA:includes,supplierIvaRate:sv,saleIvaType:saleType,saleIvaRate:['exento','excluido'].includes(saleType)?0:num(saleType),margin:Math.min(90,Math.max(0,num(val(r,ix.margin,'35')))),sku:val(r,ix.sku),updatedAt:localDate()});added++}}save();render();toast(`Importación lista: ${added} agregado(s), ${skipped} omitido(s)`)}catch(err){console.error(err);toast('No se pudo leer el archivo. Guárdalo nuevamente como CSV UTF-8.')}}
