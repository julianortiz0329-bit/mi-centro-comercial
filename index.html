<!doctype html>
<html lang="es" data-palette="zafiro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c110f" media="(prefers-color-scheme: dark)">
<meta name="description" content="Libro de socios de Alegría Pet Home: ventas, gastos, aportes, caja y reparto de utilidades.">
<meta name="color-scheme" content="light dark">
<title>Alegría · Libro de socios</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
<script>
  // Aplica el tema guardado antes de pintar (evita parpadeo).
  try {
    var p = JSON.parse(localStorage.getItem('alegria_ui_prefs') || '{}'), r = document.documentElement;
    if (p.theme === 'light' || p.theme === 'dark') r.dataset.theme = p.theme;
    if (p.motion === false) r.dataset.motion = 'off';
  } catch (e) {}
</script>
<script type="module" src="js/app.js"></script>
</head>
<body data-mode="pethome" data-active-scope="pethome">
<div id="splash" role="presentation"><div class="sp"><span class="sp-paw" aria-hidden="true">🐾</span><b>Alegría Pet Home</b><small>Libro de socios</small></div></div>
<a class="skip" href="#main">Saltar al contenido</a>
<div id="ambient" aria-hidden="true"><i class="aur"></i><i class="grn"></i></div>
<div class="app">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="brand" data-brand></div>
    <nav id="nav-main"></nav>
    <p class="local-tag">🔒 Solo entran los socios con su clave</p>
  </aside>
  <div class="content">
    <div class="top-stack">
    <header class="topbar">
      <div class="brand-row"><div class="brand mobile-only" data-brand></div><div class="top-actions"><button type="button" class="icon-toggle" data-act="sync-now" aria-label="Sincronizar" title="Sincronizar" data-sync-btn></button><button type="button" class="icon-toggle" data-discreet aria-pressed="false" aria-label="Ocultar montos" title="Ocultar montos"></button></div></div>
    </header>
    </div>
    <main id="main" class="main" tabindex="-1"><p class="loading">Cargando el libro…</p></main>
  </div>
  <nav id="nav-top" class="tab-bar" aria-label="Navegación"></nav>
  <button type="button" class="fab" data-fab aria-haspopup="true" aria-expanded="false" aria-label="Registrar"></button>
  <div class="fab-scrim" aria-hidden="true"></div>
  <div id="fab-menu" class="fab-menu" aria-hidden="true"></div>
</div>
<div id="modal-root"></div>
<div id="toast-root" class="toasts" aria-live="polite"></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
</body>
</html>
